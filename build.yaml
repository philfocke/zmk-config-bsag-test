include:
  - board: xiao_ble//zmk
    shield: totem_left
    artifact-name: totem_left
  - board: xiao_ble//zmk
    shield: totem_right
    artifact-name: totem_right
# there is no settingsreset (needed) for the XIAO
# NOTE: the board MUST carry the `//zmk` variant suffix. Plain `xiao_ble` builds
# Zephyr's stock board definition, which has no ZMK defconfig -> no Bluetooth at all.
# The suffix contains slashes, so artifact-name must be set explicitly: the default
# is derived from the board name and the slashes break the output path.
